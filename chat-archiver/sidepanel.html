<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Synapse</title>
<link rel="stylesheet" href="sidepanel-dark.css" id="themeLink" />
<style>
  header {
    position: relative;
  }
  
  .theme-toggle {
    position: absolute !important;
  }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <h1>Synapse</h1>
    </div>
    <div class="status">
      <span id="siteStatus">Checking…</span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
  </header>

  <section id="authSection">
    <h2>Account</h2>

    <div id="loggedOutView">
      <div class="account-row">
        <div class="avatar avatar-guest">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <span class="account-status">Not logged in</span>
      </div>
      <input id="emailInput" type="email" placeholder="Email" />
      <input id="passwordInput" type="password" placeholder="Password" />
      <div class="row">
        <button id="loginBtn" class="secondary">Log in</button>
        <button id="registerBtn" class="secondary">Register</button>
      </div>
    </div>

    <div id="loggedInView" style="display:none;">
      <div class="account-row row-between">
        <div class="account-row">
          <div class="avatar" id="avatarInitial"></div>
          <span id="userEmail" class="account-email"></span>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Log out">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div id="authMsg" class="msg"></div>
  </section>

  <section id="captureSection">
    <h2><span class="idx">📸</span>Capture</h2>
    <button id="captureBtn">Capture this conversation</button>
    <div id="captureMsg" class="msg"></div>
  </section>

  <section id="injectSection">
    <h2><span class="idx">💉</span>Inject Prompt</h2>
    <textarea id="promptText" placeholder="Type a prompt to inject into the active chat..."></textarea>
    <label class="checkbox">
      <input type="checkbox" id="autoSubmit" checked />
      <span class="checkbox-box"></span>
      Auto-submit after inserting
    </label>
    <button id="injectBtn">Inject prompt</button>
    <div id="injectMsg" class="msg"></div>
  </section>

  <section id="archiveSection">
    <h2><span class="idx">📁</span>Archived Chats <span class="count-badge"><span id="chatCount">0</span></span></h2>
    <div id="chatList"><div id="emptyState">No captured conversations yet.</div></div>
    <div class="footer-actions">
      <button id="exportBtn" class="secondary">Export</button>
      <button id="clearBtn" class="danger">Clear all</button>
    </div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
